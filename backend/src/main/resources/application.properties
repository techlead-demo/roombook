spring.application.name=roombook
server.port=${API_PORT:5202}

# H2 file database, relative to the working directory (backend/ when started with spring-boot:run)
spring.datasource.url=jdbc:h2:file:./data/roombook
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON: snake_case properties; java.time values as ISO 8601 strings
spring.jackson.property-naming-strategy=SNAKE_CASE
# A fractional number for an integer property is a 400, not silently truncated (RMB-4 BR-9: capacity 2.5)
spring.jackson.deserialization.accept-float-as-int=false

# Office time zone: used only to interpret calendar dates and for display
roombook.office.time-zone=Asia/Ho_Chi_Minh
# Insert sample bookings for today at startup (if today has none)
roombook.sample-bookings.enabled=true
